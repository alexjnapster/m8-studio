name: macOS build and policy checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Keyboard and capability policies
        run: zsh Tests/test-keyboard.sh
      - name: Internal Carbon dispatch
        run: zsh Tests/test-carbon.sh
      - name: Sound DSP numerical checks
        run: python3 Tests/test-sound.py
      - name: Audio buffer memory checks
        run: zsh Tests/test-audio-buffers.sh
      - name: Sound lifecycle recovery checks
        run: zsh Tests/test-sound-lifecycle.sh
      - name: Integrated sound model and migration
        run: zsh Tests/test-sound-model.sh
      - name: Favorite display modes
        run: zsh Tests/test-mode-favorites.sh
      - name: Display assistance and virtual canvas validation
        run: |
          zsh Tests/test-display-assistance.sh
          zsh Tests/test-virtual-canvas.sh
      - name: Navigation route boundaries
        run: zsh Tests/test-studio-routes.sh
      - name: Build sandboxed widget prototype
        run: zsh build-widget-preview.sh
      - name: Build sound companion
        run: zsh build-sound.sh
      - name: Build Apple silicon app
        run: zsh build.sh
      - name: Verify bundle
        run: codesign --verify --deep --strict "M8 Studio.app"
      - name: Stage distribution archive
        run: |
          mkdir -p artifacts
          cp "../M8 Studio.zip" artifacts/M8-Studio-arm64.zip
          cp "../M8 Studio Sound.zip" artifacts/M8-Studio-Sound-arm64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: M8-Studio-arm64-development
          path: artifacts/*.zip
          if-no-files-found: error
